[env]
lib_deps =
  fastled/FastLED @ ^3.7.0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DI2S_BCLK_PIN=5
  -DI2S_WS_PIN=6
  -DI2S_DIN_PIN=7
  ; Feature toggles (override include/elsa_config.h defaults)
  -DENABLE_HAIR_STRIP=0
  -DTEST_SOLID_COLOR=0
  -DENABLE_WEB_TELEMETRY=0
  -DENABLE_CONFIG_ENDPOINT=0
  -DENABLE_WIFI_KEEPALIVE=0
  -DENABLE_OTA=1
  -DAUDIO_TASK_ENABLE=1
  -DENABLE_FADE_TO_STARTUP=1
  -DENABLE_BEAT_WAVES=1
  -DENABLE_FALLBACK_WAVES=1
  -DDEBUG_BEAT_TIMING=0
  -DDEBUG_WAVE_TIMING=0
  -DPROFILE_PERF=0

[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-super-mini-4m2m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_port = /dev/cu.usbmodem21101
; Upload over USB (default)
upload_protocol = esptool

; OTA upload (optional)
; upload_protocol = espota
; upload_port = 192.168.31.154
; upload_flags =
;   --auth=${sysenv.OTA_PASSWORD}

[env:esp32-s3-super-mini-ota]
platform = espressif32
board = esp32-s3-super-mini-4m2m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_port = /dev/cu.usbmodem21301
upload_protocol = espota
upload_port = 192.168.31.154
extra_scripts = pre:scripts/ota_from_secrets.py

[env:esp32-s3-super-mini-debug]
extends = env:esp32-s3-super-mini
build_flags =
  ${env.build_flags}
  -DENABLE_WEB_TELEMETRY=1
  -DENABLE_CONFIG_ENDPOINT=1
  -DPROFILE_PERF=1
  -DDEBUG_BEAT_TIMING=1
  -DDEBUG_WAVE_TIMING=1
